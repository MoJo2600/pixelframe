; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_d32_pro

[env]
framework = arduino

[env:lolin_d32_pro]
platform = espressif32 @ ^6.7.0
board = lolin_d32_pro
monitor_speed = 115200
extra_scripts = replace_fs.py
; change MCU frequency
board_build.f_cpu = 240000000L
;board_build.f_flash = 160000000L
upload_speed = 1000000
board_build.filesystem = littlefs
; lib_ldf_mode = deep+
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 16MB
; board_upload.maximum_size = 8388608
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
build_flags = 
	${env.build_flags} 
	-D=${PIOENV} 
	;-D CONFIG_LITTLEFS_FOR_IDF_3_2
lib_deps =
    adafruit/Adafruit BusIO @ ^1.17.0
    adafruit/Adafruit GFX Library @ ^1.12.0
    adafruit/Adafruit NeoPixel @ ^1.15.0
    arduino-libraries/NTPClient @ ^3.2.1
    bblanchon/ArduinoJson @ ^7.4.0
    fastled/FastLED @ ^3.10.0
    greiman/SdFat @ ^2.3.0
    knolleary/PubSubClient @ ^2.8.0
    Links2004/WebSockets @ ^2.7.0
    https://github.com/marcmerlin/FastLED_NeoMatrix.git#master
    ropg/ezTime @ ^0.8.3
    https://github.com/ayushsharma82/AsyncElegantOTA.git#v2.2.8
    ottowinter/ESPAsyncTCP-esphome @ ^1.2.3
    me-no-dev/AsyncTCP @ ^3.3.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git#f71e3d427b5be9791a8a2c93cf8079792c3a9a26
    https://github.com/tzapu/WiFiManager.git#master
    ; https://github.com/khoih-prog/ESPAsync_WiFiManager.git#v1.12.2
    ; khoih-prog/ESP_DoubleResetDetector@>=1.3.1
